# PatchPilot 依赖服务 + 面板
# 启动：docker compose up -d     停止：docker compose down
#
# 说明：Langfuse 观测栈（clickhouse + minio + langfuse-web）体量较大，
# 计划以独立 profile 加入，避免默认拉取大量镜像。
# 当前的可观测性由 src/patchpilot/observability 输出 JSONL trace，
# 再由 `panel` 服务（本文件最后的 app）在浏览器里回放。
name: patchpilot

services:
  postgres:
    image: postgres:16-alpine
    container_name: patchpilot-postgres
    environment:
      POSTGRES_USER: patchpilot
      POSTGRES_PASSWORD: patchpilot
      POSTGRES_DB: patchpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchpilot -d patchpilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: patchpilot-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    container_name: patchpilot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  # ---- 面板（验收项 7）----
  # 只读服务：把宿主的 trace 目录与评测产物以**只读**方式挂进来，浏览器打开
  # http://127.0.0.1:8000 即可回放轨迹、查看指标。
  panel:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: patchpilot-panel:0.1.0
    container_name: patchpilot-panel
    ports:
      - "8000:8000"
    volumes:
      # 宿主 trace 目录（pp run 产出）。Windows 主机默认在 %TEMP%\patchpilot-traces，
      # 可用 PP_TRACE_DIR 覆盖；不存在时 compose 会创建空目录（面板显示"还没有 trace"）。
      - ${PP_TRACE_DIR:-./.patchpilot/traces}:/data/traces:ro
      - ${PP_EVAL_DIR:-./eval}:/data/eval:ro
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  qdrantdata:

