name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install -e ".[dev]"

      # 与本地 pp check 使用同一套确定性门禁，避免"本地过了 CI 挂了"
      - name: 确定性门禁（语法 / ruff / pytest / 密钥扫描 / gitignore）
        run: python -m patchpilot.cli check --json

      - name: 骨架冒烟
        run: python -m patchpilot.cli smoke
